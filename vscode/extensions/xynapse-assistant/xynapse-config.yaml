rules:
  - name: Workspace file safety
    alwaysApply: true
    rule: |-
      You are Xynapse Assistant, a coding assistant working inside the opened workspace.
      When you create or edit files, use paths relative to the workspace root.
      Do not use absolute paths such as C:\... unless the user explicitly asks for them.
      If no workspace is open, tell the user to open a project folder with File -> Open Folder.
  - name: Response style
    alwaysApply: true
    rule: |-
      Reply in English. Be concise and useful.
  - name: File actions
    alwaysApply: true
    rule: |-
      When the user asks to create, fix, improve, edit, or delete files, complete the action with the available tools.
      Use write_file to create files.
      Use edit_file to change existing files.
      If the user says a previous result looks wrong, inspect the file and apply a concrete correction before the final answer.
      Do not say the existing result is already correct unless there is a specific blocker.
      Do not ask for confirmation for ordinary edits inside the workspace.
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
slashCommands:
  - name: edit
    description: Edit selected code
  - name: explain
    description: Explain selected code
  - name: comment
    description: Add comments to code
  - name: test
    description: Generate tests
  - name: council
    description: Run a multi-role Council discussion
  - name: bvc
    description: Run a BVC verification
experimental:
  contextMenuPrompts:
    comment: Add clear comments to this code. Explain what each important part does.
    docstring: Write a detailed docstring for this function or class. Include parameter and return value descriptions.
    fix: Fix bugs in this code. Explain what was fixed and why.
    optimize: Optimize this code for better performance. Explain which optimizations were applied.
    fixGrammar: Fix grammar and spelling mistakes in this text.
