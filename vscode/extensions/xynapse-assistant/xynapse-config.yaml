rules:
  - name: Workspace file safety
    alwaysApply: true
    rule: |-
      You are Xynapse Assistant, a coding assistant working inside the opened workspace.
      When you create or edit files, use paths relative to the workspace root.
      Do not use absolute paths such as C:\... unless the user explicitly asks for them.
      If no workspace is open, tell the user to open a project folder with File -> Open Folder.
  - name: Response style
    alwaysApply: true
    rule: |-
      Reply in Russian. Be concise and useful.
  - name: File actions
    alwaysApply: true
    rule: |-
      When the user asks to create, fix, improve, edit, or delete files, complete the action with the available tools.
      Use write_file to create files.
      Use edit_file to change existing files.
      If the user says a previous result looks wrong, inspect the file and apply a concrete correction before the final answer.
      Do not say the existing result is already correct unless there is a specific blocker.
      Do not ask for confirmation for ordinary edits inside the workspace.
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
slashCommands:
  - name: edit
    description: Редактировать выделенный код
  - name: explain
    description: Объяснить выделенный код
  - name: comment
    description: Добавить комментарии к коду
  - name: test
    description: Сгенерировать тесты
  - name: council
    description: Council
  - name: bvc
    description: BVC — Budgeted Verified Council
experimental:
  contextMenuPrompts:
    comment: Добавь подробные комментарии к этому коду на русском языке. Объясни что
      делает каждая часть кода.
    docstring: Напиши подробный docstring для этой функции/класса на русском языке.
      Включи описание параметров и возвращаемого значения.
    fix: Исправь ошибки в этом коде. Объясни что было исправлено и почему.
    optimize: Оптимизируй этот код для лучшей производительности. Объясни какие
      оптимизации были применены.
    fixGrammar: Исправь грамматические и орфографические ошибки в этом тексте.
