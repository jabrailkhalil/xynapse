# Xynapse Assistant Configuration
# Copy this file to ~/.xynapse/config.yaml and set the environment variables
# YANDEX_API_KEY and YANDEX_FOLDER_ID. Do not commit real credentials.

name: "Xynapse Config"
version: "1.0.0"
schema: "v1"
responseLanguage: "en"

# Models configuration
models:
  # ── YandexGPT Foundation Models ──

  # YandexGPT Pro 5 — основная модель 5-го поколения
  - name: "YandexGPT Pro 5"
    provider: "yandex_gpt"
    model: yandexgpt-5-pro
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # YandexGPT Pro 5.1 — улучшенная версия Pro 5
  - name: "YandexGPT Pro 5.1"
    provider: "yandex_gpt"
    model: yandexgpt-5.1
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # YandexGPT Lite 5 — лёгкая быстрая модель для автодополнения
  - name: "YandexGPT Lite 5"
    provider: "yandex_gpt"
    model: yandexgpt-5-lite
    apiKey: "$YANDEX_API_KEY"
    roles:
      - autocomplete
    defaultCompletionOptions:
      temperature: 0.1
      maxTokens: 2048
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # Alice AI LLM — модель Алисы
  - name: "Alice AI LLM"
    provider: "yandex_gpt"
    model: aliceai-llm
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.5
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # Alice AI LLM Flash — быстрая модель Алисы
  - name: "Alice AI LLM Flash"
    provider: "yandex_gpt"
    model: aliceai-llm-flash
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # ── Сторонние модели на Yandex Cloud ──

  # DeepSeek V4 Flash — актуальная модель с контекстом 1M
  - name: "DeepSeek V4 Flash"
    provider: "yandex_gpt"
    model: deepseek-v4-flash
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # Qwen3 235B — крупнейшая open-source модель
  - name: "Qwen3 235B"
    provider: "yandex_gpt"
    model: qwen3-235b-a22b-fp8
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # Qwen3.6 35B — актуальная 35B модель Qwen
  - name: Qwen3.6 35B
    provider: "yandex_gpt"
    model: qwen3.6-35b-a3b
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # gpt-oss-120b — большая open-source модель
  - name: "gpt-oss-120b"
    provider: "yandex_gpt"
    model: gpt-oss-120b
    apiKey: "$YANDEX_API_KEY"
    roles:
      - chat
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 8192
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # gpt-oss-20b — компактная open-source модель
  - name: "gpt-oss-20b"
    provider: "yandex_gpt"
    model: gpt-oss-20b
    apiKey: "$YANDEX_API_KEY"
    roles:
      - autocomplete
    defaultCompletionOptions:
      temperature: 0.1
      maxTokens: 4096
    requestOptions:
      extraBodyProperties:
        folderId: "$YANDEX_FOLDER_ID"

  # ── GigaChat models ──

  - name: "GigaChat"
    provider: "gigachat"
    model: "GigaChat"
    apiKey: "$GIGACHAT_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 4096
    requestOptions:
      verifySsl: true
      extraBodyProperties:
        scope: "$GIGACHAT_SCOPE"

  - name: "GigaChat Plus"
    provider: "gigachat"
    model: "GigaChat-Plus"
    apiKey: "$GIGACHAT_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 4096
    requestOptions:
      verifySsl: true
      extraBodyProperties:
        scope: "$GIGACHAT_SCOPE"

  - name: "GigaChat Pro"
    provider: "gigachat"
    model: "GigaChat-Pro"
    apiKey: "$GIGACHAT_API_KEY"
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      temperature: 0.3
      maxTokens: 4096
    requestOptions:
      verifySsl: true
      extraBodyProperties:
        scope: "$GIGACHAT_SCOPE"

# Context providers
rules:
  - name: Workspace file safety
    alwaysApply: true
    rule: |-
      You are Xynapse Assistant, a coding assistant working inside the opened workspace.
      When you create or edit files, use paths relative to the workspace root.
      Do not use absolute paths such as C:\... unless the user explicitly asks for them.
      If no workspace is open, tell the user to open a project folder with File -> Open Folder.
  - name: Response style
    alwaysApply: true
    rule: |-
      Reply in English. Be concise and useful.
  - name: File actions
    alwaysApply: true
    rule: |-
      When the user asks to create, fix, improve, edit, or delete files, complete the action with the available tools.
      Use write_file to create files.
      Use edit_file to change existing files.
      If the user says a previous result looks wrong, inspect the file and apply a concrete correction before the final answer.
      Do not say the existing result is already correct unless there is a specific blocker.
      Do not ask for confirmation for ordinary edits inside the workspace.
context:
  - provider: "code"
  - provider: "docs"
  - provider: "diff"
  - provider: "terminal"
  - provider: "problems"
  - provider: "folder"
  - provider: "codebase"

# Slash commands
slashCommands:
  - name: "edit"
    description: "Edit selected code"
  - name: "explain"
    description: "Explain selected code"
  - name: "comment"
    description: "Add comments to code"
  - name: "test"
    description: "Generate tests"
  - name: "council"
    description: "Run a multi-role Council discussion"
  - name: "bvc"
    description: "Run a BVC verification"

# Custom prompts for context menu actions
experimental:
  contextMenuPrompts:
    comment: "Add clear comments to this code. Explain what each important part does."
    docstring: "Write a detailed docstring for this function or class. Include parameter and return value descriptions."
    fix: "Fix bugs in this code. Explain what was fixed and why."
    optimize: "Optimize this code for better performance. Explain which optimizations were applied."
    fixGrammar: "Fix grammar and spelling mistakes in this text."
